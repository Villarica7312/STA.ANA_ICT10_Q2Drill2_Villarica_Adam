<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <title>2nd Quarter | Drill 2</title>

    <style>
        /* ---------- Colorful theme: orange, purple, pink ---------- */
        :root {
            --orange: #ff8a00;
            --purple: #7b2ff7;
            --pink:   #ff3d9a;
            --dark:   #2a0a4a;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--orange), var(--pink) 50%, var(--purple));
            background-attachment: fixed;
        }

        /* White card holding the form and the results */
        .main-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 18px 45px rgba(42, 10, 74, 0.4);
            border-top: 10px solid var(--orange);
            border-bottom: 10px solid var(--purple);
        }

        .page-title {
            font-weight: 800;
            background: linear-gradient(90deg, var(--orange), var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub-title { color: #7a5a99; margin-bottom: 1.5rem; }

        /* Text boxes */
        .form-control {
            border: 2px solid var(--purple);
            border-radius: 14px;
            padding: 0.75rem 1.1rem;
        }
        .form-control:focus {
            border-color: var(--pink);
            box-shadow: 0 0 0 0.25rem rgba(255, 61, 154, 0.3);
        }

        /* Submit button */
        .btn-colorful {
            background: linear-gradient(90deg, var(--orange), var(--pink));
            color: white;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            padding: 0.65rem 2.4rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-colorful:hover {
            background: linear-gradient(90deg, var(--pink), var(--purple));
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(123, 47, 247, 0.45);
        }

        /* Output box: plain list of names, then the total */
        #output {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff3c4;
            font-size: 20px;
            line-height: 1.55;
            border-radius: 16px;
            padding: 1.1rem 1.4rem;
            border-left: 10px solid var(--orange);
            box-shadow: 0 8px 20px rgba(123, 47, 247, 0.35);
        }
        .results-title { font-weight: 800; color: white; margin-bottom: 0.25rem; }
        .results-list  { margin-bottom: 0.6rem; }
        .results-total {
            display: inline-block;
            background: var(--orange);
            color: white;
            font-weight: 800;
            border-radius: 20px;
            padding: 0.15rem 1rem;
        }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 720px;">
        <div class="main-card">
            <h3 class="page-title">Add new club member:</h3>
            <p class="sub-title mb-4">Type a cartoon character's first and last name, then press Submit.</p>

            <form class="mb-4">
                <div class="mb-3">
                    <input type="text" id="first_name" class="form-control" placeholder="Enter the first name">
                </div>
                <div class="mb-3">
                    <input type="text" id="last_name" class="form-control" placeholder="Enter the last name">
                </div>
                <!-- py-click triggers result_checker() in main.py -->
                <input type="button" value="Submit" py-click="result_checker" class="btn btn-colorful">
            </form>

            <!-- All members and the total are written here by main.py -->
            <div id="output"></div>
        </div>
    </div>

    <!-- Python logic lives in main.py -->
    <py-script src="main.py"></py-script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
